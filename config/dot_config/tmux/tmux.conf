# -- general -------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set-option -g default-shell /bin/fish
set-option -g update-environment "DISPLAY XAUTHORITY SSH_AUTH_SOCK SSH_CONNECTION"

unbind-key C-b
set-option -g prefix C-a                  # GNU-Screen compatible prefix
bind-key C-a send-prefix

set -g history-limit 5000                 # boost history

set -g mouse on

# - bindings -------------------------------------------------------------------
set-window-option -g mode-keys vi

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


bind r source-file $HOME/.config/tmux/tmux.conf \; display '$HOME/.config/tmux/tmux.conf source'

bind -n M-H previous-window
bind -n M-L next-window
# unbind-key -T copy-mode-vi v
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe "xsel -ib"
#
## use c-k/c-j to move commits up/down within lazygit
is_lg="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?lazygit$'"

#
# -- display -------------------------------------------------------------------
set -g base-index 1         # start windows numbering at 1
setw -g pane-base-index 1   # make pane numbering consistent with windows

setw -g automatic-rename on # rename window to reflect current program
set -g renumber-windows on  # renumber windows when a window is closed

set -g set-titles on                        # set terminal title
set -g set-titles-string '#h ❐ #S ● #I #W'

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time

set -g status-interval 10     # redraw status line every 10 seconds

# -- theme ----------------------------------------------------------------------
# set -g @plugin 'catppuccin/tmux'
# set -g @catppuccin_flavor 'mocha'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'egel/tmux-gruvbox'
# set desired theme options...
set -g @tmux-gruvbox 'dark256' # or 'dark16', 'light', 'light256'
