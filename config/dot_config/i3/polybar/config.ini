include-directory = modules
include-file = theme.ini

[bar/root]
override-redirect = true
wm-restack = i3
background = ${colors.base}
border-color = ${colors.crust}
foreground = ${colors.text}
font-0 = FiraCode Nerd Font:pixelsize=10;
font-1 = Symbols Nerd Font:pixelsize=10;
; font-1 = FiraCode:pixelsize=10;

[bar/left]
inherit = bar/root
monitor = ${env:MONITOR:}
modules-left = date
offset-x = 0.3%
width = 10%

[bar/center]
inherit = bar/root
monitor = ${env:MONITOR:}
modules-center = i3
offset-x = 45%
width = 10%

[bar/right]
inherit = bar/root
monitor = ${env:MONITOR:}
module-margin = 1
modules-right = memory cpu pulseaudio battery tray
offset-x = 70%
width = 30%



